# -----------------------------------------------------------------------------
# Project VocalEyes — packaging metadata
# -----------------------------------------------------------------------------
# Everything the installer needs lives here; requirements.txt exists only so
# the documented `pip install -r requirements.txt` keeps working.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "vocaleyes"
description = "Select with a long blink — an on-device accessibility tool for people with advanced ALS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Maanas Pabbathi" }]
keywords = [
    "accessibility",
    "ALS",
    "eye-tracking",
    "blink-detection",
    "mediapipe",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
