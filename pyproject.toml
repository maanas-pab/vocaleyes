# -----------------------------------------------------------------------------
# Project VocalEyes — packaging metadata
# -----------------------------------------------------------------------------
# Everything the installer needs lives here; requirements.txt exists only so
# the documented `pip install -r requirements.txt` keeps working.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "vocaleyes"
description = "Select with a long blink — an on-device accessibility tool for people with advanced ALS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Maanas Pabbathi" }]
keywords = [
    "accessibility",
    "ALS",
    "eye-tracking",
    "blink-detection",
    "mediapipe",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Utilities",
]
dependencies = [
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "numpy>=1.24",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/maanas-pab/vocaleyes"
Repository = "https://github.com/maanas-pab/vocaleyes"
Issues = "https://github.com/maanas-pab/vocaleyes/issues"

# -----------------------------------------------------------------------------
# Console scripts and package discovery
# -----------------------------------------------------------------------------
[project.scripts]
vocaleyes = "vocaleyes.cli:main"

[tool.setuptools]
packages = ["vocaleyes"]

[tool.setuptools.package-data]
# The shipped presets are read-only JSON a carer picks from; without
# this they would be left out of a wheel and `vocaleyes profiles` would
# come up empty for anyone who installed rather than cloned.
vocaleyes = ["presets/*.json"]

[tool.setuptools.dynamic]
version = { attr = "vocaleyes._version.__version__" }
